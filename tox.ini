[tox]
envlist = py311, py312, py313, py314, flake8

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, flake8

[testenv:flake8]
basepython = python
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    python -m flake8 pyilluminate setup.py
;   mypy is broken
;   python -m mypy pyilluminate

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pip install -U pip
    pip list
    pytest -m "not device" --basetemp={envtmpdir}
